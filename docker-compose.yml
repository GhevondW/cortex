services:
  # 1. Run Tests on Linux (Native Clang)
  test-native:
    build: .
    volumes: [".:/workspace"]
    environment:
      - CORTEX_USE_SANITIZERS=${CORTEX_USE_SANITIZERS:-OFF}
    command: >
      bash -c "cmake -B build/native -DCORTEX_BUILD_TESTS=ON -DCORTEX_USE_SANITIZERS=$${CORTEX_USE_SANITIZERS} &&
               cmake --build build/native &&
               ctest --test-dir build/native --output-on-failure"

  # 1b. The same tests built with Clang 19 (the image's default c++ is GCC 13)
  test-native-clang:
    build: .
    volumes: [".:/workspace"]
    command: >
      bash -c "cmake -B build/native-clang -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 -DCORTEX_BUILD_TESTS=ON &&
               cmake --build build/native-clang --parallel &&
               ctest --test-dir build/native-clang --output-on-failure"

  # 2. Run Tests on WASM (Node.js Emulation)
  test-wasm:
    build: .
    volumes:
      - .:/workspace
    environment:
      - CORTEX_USE_SANITIZERS=${CORTEX_USE_SANITIZERS:-OFF}
    command: >
      bash -c "
      source /opt/emsdk/emsdk_env.sh &&
      rm -rf build/wasm &&
      emcmake cmake -B build/wasm -G Ninja -DCORTEX_BUILD_TESTS=ON -DCORTEX_USE_SANITIZERS=$${CORTEX_USE_SANITIZERS} &&
      cmake --build build/wasm &&
      ctest --test-dir build/wasm --output-on-failure
      "

  # 2b. Packaging checks: consume cortex with add_subdirectory (FetchContent)
  #     and, after installing it against system Boost, with find_package
  test-package:
    build: .
    volumes: [".:/workspace"]
    environment:
      - CORTEX_PACKAGE_CMAKE_ARGS=-DCPM_SOURCE_CACHE=/workspace/build/cpm-cache
    command: >
      bash -c "tests/package/check_subdirectory.sh build/package-subdir &&
               tests/package/check_install.sh build/package-install"

  # 3. Build Native Examples
  build-example-native:
    build: .
    volumes: [".:/workspace"]
    command: >
      bash -c "cmake -B build/native -DCORTEX_BUILD_EXAMPLES=ON && 
               cmake --build build/native &&
               echo -e '\n--- Running binary tree example ---' &&
               ./build/native/examples/binary_tree_example &&
               echo -e '\n--- Running runtime tour ---' &&
               ./build/native/examples/runtime_tour"

  # 4. Build and Run WASM Example
  build-example-wasm:
    build: .
    volumes: [".:/workspace"]
    command: >
      bash -c "
      source /opt/emsdk/emsdk_env.sh &&
      emcmake cmake -B build/wasm -G Ninja -DCORTEX_BUILD_EXAMPLES=ON &&
      cmake --build build/wasm &&
      cd build/wasm/examples &&
      node wasm_example.js &&
      node /workspace/examples/wasm/responsive_demo_test.mjs responsive_demo.js cortex.mjs
      "

  # 5. Serve WASM Example in Browser
  serve-example:
      build: .
      volumes:
        - .:/workspace
      ports:
        - "8080:8080"
      environment:
        - BUILD_TYPE=${BUILD_TYPE:-Release}
      command: >
        bash -c "
        source /opt/emsdk/emsdk_env.sh &&
        emcmake cmake -B build/wasm -G Ninja -DCMAKE_BUILD_TYPE=$${BUILD_TYPE} -DCORTEX_BUILD_EXAMPLES=ON &&
        cmake --build build/wasm --config $${BUILD_TYPE} &&
        cd build/wasm &&
        echo \"Examples built successfully in $${BUILD_TYPE} mode!\" &&
        echo '' &&
        echo 'Available at:' &&
        echo '  → http://localhost:8080/examples/examples_index.html (All Examples)' &&
        echo '  → http://localhost:8080/examples/responsive_demo.html (Responsive C++ - Start here!)' &&
        echo '  → http://localhost:8080/examples/sudoku_demo.html (Sudoku Solver - Must See!)' &&
        echo '  → http://localhost:8080/examples/particle_demo.html (Particle Demo - Recommended!)' &&
        echo '  → http://localhost:8080/examples/index.html (Basic Example)' &&
        echo '' &&
        python3 -m http.server 8080
        "

  # 6. Build AlgoViz (compile check)
  build-algoviz:
    build: .
    volumes: [".:/workspace"]
    command: >
      bash -c "
      source /opt/emsdk/emsdk_env.sh &&
      rm -rf build/wasm-algoviz &&
      emcmake cmake -B build/wasm-algoviz -G Ninja -DCORTEX_BUILD_APPS=ON &&
      cmake --build build/wasm-algoviz --target algo_viz &&
      echo 'AlgoViz build succeeded'
      "

  # 7. Build and Serve AlgoViz BST Visualizer
  serve-algoviz:
      build: .
      volumes:
        - .:/workspace
      ports:
        - "8080:8080"
      environment:
        - BUILD_TYPE=${BUILD_TYPE:-Release}
      command: >
        bash -c "
        source /opt/emsdk/emsdk_env.sh &&
        rm -rf build/wasm-algoviz &&
        emcmake cmake -B build/wasm-algoviz -G Ninja -DCMAKE_BUILD_TYPE=$${BUILD_TYPE} -DCORTEX_BUILD_APPS=ON &&
        cmake --build build/wasm-algoviz --config $${BUILD_TYPE} --target algo_viz &&
        echo '' &&
        echo '✅ AlgoViz built successfully in $${BUILD_TYPE} mode!' &&
        echo '' &&
        echo '  → http://localhost:8080' &&
        echo '' &&
        cd build/wasm-algoviz/apps/algo_viz &&
        python3 -m http.server 8080
        "

  # 8. Build and Serve Video Editor
  serve-video-editor:
      build: .
      volumes:
        - .:/workspace
      ports:
        - "8080:8080"
      environment:
        - BUILD_TYPE=${BUILD_TYPE:-Release}
      command: >
        bash -c "
        source /opt/emsdk/emsdk_env.sh &&
        rm -rf build/wasm-video-editor &&
        emcmake cmake -B build/wasm-video-editor -G Ninja -DCMAKE_BUILD_TYPE=$${BUILD_TYPE} -DCORTEX_BUILD_APPS=ON &&
        cmake --build build/wasm-video-editor --config $${BUILD_TYPE} --target video_editor &&
        echo '' &&
        echo '✅ Video Editor built successfully in $${BUILD_TYPE} mode!' &&
        echo '' &&
        echo '  → http://localhost:8080' &&
        echo '' &&
        cd build/wasm-video-editor/apps/video_editor &&
        python3 -m http.server 8080
        "
