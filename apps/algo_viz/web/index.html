<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoViz Pro — BST Visualizer</title>
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- App Bar -->
  <nav class="app-bar">
    <div class="app-bar__title-group">
      <span class="app-bar__title">AlgoViz Pro</span>
      <span class="app-bar__subtitle">BST Visualizer</span>
    </div>
    <span class="app-bar__badge">Powered by Cortex</span>
  </nav>

  <main class="content">
    <!-- Canvas Card -->
    <div class="card canvas-card">
      <div class="canvas-card__container" id="canvasContainer">
        <canvas id="treeCanvas"></canvas>
        <div class="canvas-card__empty-msg" id="emptyMsg">Load a preset tree or add nodes to begin</div>
        <div class="canvas-toolbar">
          <button class="canvas-toolbar__btn" id="zoomInBtn" title="Zoom in">+</button>
          <button class="canvas-toolbar__btn" id="zoomOutBtn" title="Zoom out">&minus;</button>
          <button class="canvas-toolbar__btn" id="fitBtn" title="Fit to view">&#x2922;</button>
          <button class="canvas-toolbar__btn" id="spreadHBtn" title="Spread horizontally">&#x2194;</button>
          <button class="canvas-toolbar__btn" id="shrinkHBtn" title="Shrink horizontally">&#x21A4;</button>
          <button class="canvas-toolbar__btn" id="spreadVBtn" title="Spread vertically">&#x2195;</button>
          <button class="canvas-toolbar__btn" id="shrinkVBtn" title="Shrink vertically">&#x21A5;</button>
        </div>
      </div>
      <div class="output-bar">
        <span class="output-bar__label">Output:</span>
        <span class="output-bar__values" id="traversalOutput">&mdash;</span>
      </div>
    </div>

    <!-- Controls Row -->
    <div class="controls-row">
      <!-- Algorithm Card -->
      <div class="card">
        <div class="card__title">Algorithm</div>

        <div class="field-group">
          <label class="field-label" for="algorithmSelect">Operation</label>
          <select class="field-select" id="algorithmSelect">
            <option value="0">BST Insert</option>
            <option value="1">BST Delete</option>
            <option value="2">BST Find</option>
            <option value="3">In-order Traversal</option>
            <option value="4">Pre-order Traversal</option>
            <option value="5">Post-order Traversal</option>
            <option value="6">BFS (Level-order)</option>
            <option value="7">DFS (Depth-first)</option>
          </select>
        </div>

        <div class="field-group" id="valueInputGroup">
          <label class="field-label" for="valueInput">Value</label>
          <input type="number" class="field-input" id="valueInput" value="42" min="1" max="999">
        </div>

        <div class="btn-row">
          <button class="btn btn--primary" id="runBtn" disabled>&#9654; Run</button>
          <button class="btn btn--outlined" id="stepBtn" disabled>&#9654;&#9654; Step</button>
          <button class="btn btn--outlined" id="pauseBtn" disabled>&#9646;&#9646; Pause</button>
          <button class="btn btn--text" id="resetBtn" disabled>&#9632; Reset</button>
        </div>

        <div class="speed-control">
          <label class="speed-control__label">Speed</label>
          <input type="range" class="speed-control__slider" id="speedSlider" min="1" max="100" value="60">
          <span class="speed-control__value" id="speedLabel">300ms</span>
        </div>
      </div>

      <!-- Tree Builder Card -->
      <div class="card">
        <div class="card__title">Tree</div>

        <div class="field-group">
          <label class="field-label" for="presetSelect">Preset</label>
          <select class="field-select" id="presetSelect">
            <option value="0">Balanced (7 nodes)</option>
            <option value="1">Skewed Left (5 nodes)</option>
            <option value="2">Skewed Right (5 nodes)</option>
            <option value="3">Larger (10 nodes)</option>
          </select>
        </div>

        <div class="btn-row">
          <button class="btn btn--accent" id="loadPresetBtn" disabled>Load Preset</button>
        </div>

        <div class="divider"></div>

        <div class="field-group">
          <label class="field-label">Add Node</label>
          <div class="inline-group">
            <input type="number" class="field-input" id="addValueInput" placeholder="Value" min="1" max="999">
            <button class="btn btn--outlined" id="addNodeBtn" disabled>+ Add</button>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn btn--outlined" id="randomBtn" disabled>Random (8)</button>
          <button class="btn btn--text btn--danger" id="clearBtn" disabled>Clear Tree</button>
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="card status-bar">
      <span class="status-bar__text" id="statusText">Initializing WASM module...</span>
      <div class="status-bar__stats">
        <span>Comparisons: <strong id="comparisonsEl">0</strong></span>
        <span>Steps: <strong id="stepsEl">0</strong></span>
      </div>
    </div>
  </main>

  <!-- WASM Module -->
  <script>
    // Reset Module object on page load to ensure clean state
    window.Module = {};
  </script>
  <script src="algo_viz.js"></script>

  <!-- Main Application (ES Module) -->
  <script type="module" src="js/modules/app.js"></script>
</body>
</html>
