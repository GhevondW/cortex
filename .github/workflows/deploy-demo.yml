name: Deploy WASM Demo to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      
      - name: Configure CMake for WASM Examples (Release)
        run: |
          emcmake cmake -B build/wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCORTEX_BUILD_EXAMPLES=ON
        env:
          CXXFLAGS: "-O3"
          LDFLAGS: "-O3"
      
      - name: Build WASM Examples (Optimized)
        run: cmake --build build/wasm --config Release

      - name: Configure CMake for AlgoViz (Release)
        run: |
          emcmake cmake -B build/wasm-algoviz -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCORTEX_BUILD_APPS=ON
        env:
          CXXFLAGS: "-O3"
          LDFLAGS: "-O3"

      - name: Build AlgoViz (Optimized)
        run: cmake --build build/wasm-algoviz --config Release --target algo_viz

      - name: Generate Doxygen Docs
        run: doxygen Doxyfile
      
      - name: Prepare deployment directory
        run: |
          mkdir -p deploy/examples
          mkdir -p deploy/algoviz
          mkdir -p deploy/docs

          # Copy examples
          cp build/wasm/examples/*.html deploy/examples/
          cp build/wasm/examples/*.js deploy/examples/
          cp build/wasm/examples/*.wasm deploy/examples/

          # Copy full AlgoViz app bundle (includes src/ styles/modules)
          cp -R build/wasm-algoviz/apps/algo_viz/. deploy/algoviz/

          # Copy docs
          cp -r doc/html/* deploy/docs/
          
          # Create a root index.html that links to everything
          cat > deploy/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0;url=examples/examples_index.html">
              <title>Cortex - Redirecting...</title>
          </head>
          <body>
              <p>Redirecting to <a href="examples/examples_index.html">Cortex Examples</a>...</p>
              <p><a href="algoviz/index.html">AlgoViz - BST Visualizer</a></p>
          </body>
          </html>
          EOF
          
          # Copy README for reference
          cp README.md deploy/
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deploy'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

