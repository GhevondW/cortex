name: Deploy WASM Demo to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      
      - name: Configure CMake for WASM Examples (Release)
        run: |
          emcmake cmake -B build/wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCORTEX_BUILD_EXAMPLES=ON
      
      - name: Build WASM Examples (Optimized)
        run: cmake --build build/wasm --config Release

      - name: Configure CMake for AlgoViz (Release)
        run: |
          emcmake cmake -B build/wasm-algoviz -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCORTEX_BUILD_APPS=ON

      - name: Build AlgoViz (Optimized)
        run: cmake --build build/wasm-algoviz --config Release --target algo_viz

      - name: Configure CMake for Video Editor (Release)
        run: |
          emcmake cmake -B build/wasm-video-editor -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCORTEX_BUILD_APPS=ON

      - name: Build Video Editor (Optimized)
        run: cmake --build build/wasm-video-editor --config Release --target video_editor

      - name: Generate Doxygen Docs
        run: doxygen Doxyfile

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy/examples
          mkdir -p deploy/algoviz
          mkdir -p deploy/video-editor
          mkdir -p deploy/docs

          # Copy examples and all generated runtime artifacts
          cp -R build/wasm/examples/. deploy/examples/

          # Copy the built AlgoViz app bundle (static web + compiled runtime)
          cp -R build/wasm-algoviz/apps/algo_viz/. deploy/algoviz/

          # Copy the built Video Editor bundle
          cp -R build/wasm-video-editor/apps/video_editor/. deploy/video-editor/

          # Copy docs
          cp -R doc/html/. deploy/docs/

          # Diagnostics — show what got built and what landed in deploy/
          echo "=== build/wasm-video-editor/apps/video_editor/ ==="
          ls -la build/wasm-video-editor/apps/video_editor/ || true
          echo "=== deploy/video-editor/ (top level) ==="
          ls -la deploy/video-editor/ || true
          echo "=== deploy/video-editor/src/ ==="
          ls -la deploy/video-editor/src/ || true
          echo "=== deploy/video-editor/styles/ ==="
          ls -la deploy/video-editor/styles/ || true

          # Verify required assets. Loop so we surface every missing file
          # instead of stopping silently on the first failing `test -f`.
          missing=0
          for f in \
              deploy/algoviz/index.html \
              deploy/algoviz/bst.html \
              deploy/algoviz/union_find.html \
              deploy/algoviz/src/main.js \
              deploy/algoviz/src/js/theme.js \
              deploy/algoviz/src/js/union_find.js \
              deploy/algoviz/src/styles/main.css \
              deploy/algoviz/algoviz_bst.js \
              deploy/algoviz/algoviz_bst.wasm \
              deploy/algoviz/algoviz_union_find.js \
              deploy/algoviz/algoviz_union_find.wasm \
              deploy/video-editor/index.html \
              deploy/video-editor/src/main.js \
              deploy/video-editor/src/editor_app.js \
              deploy/video-editor/src/editor_client.js \
              deploy/video-editor/styles/main.css \
              deploy/video-editor/video_editor.js \
              deploy/video-editor/video_editor.wasm
          do
              if [ ! -f "$f" ]; then
                  echo "MISSING: $f"
                  missing=1
              fi
          done
          if [ "$missing" -ne 0 ]; then
              exit 1
          fi

          # Create a root index.html that links to everything
          cat > deploy/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0;url=examples/examples_index.html">
              <title>Cortex - Redirecting...</title>
          </head>
          <body>
              <p>Redirecting to <a href="examples/examples_index.html">Cortex Examples</a>...</p>
              <p><a href="algoviz/index.html">AlgoViz - Visualization Catalog</a></p>
              <p><a href="video-editor/index.html">Cortex Video Editor</a></p>
          </body>
          </html>
          EOF
          
          # Copy README for reference
          cp README.md deploy/
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deploy'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
