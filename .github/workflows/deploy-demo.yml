name: Deploy WASM Demo to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      
      - name: Configure CMake for WASM Examples (Release)
        run: |
          emcmake cmake -B build/wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCORTEX_BUILD_EXAMPLES=ON
      
      - name: Build WASM Examples (Optimized)
        run: cmake --build build/wasm --config Release

      - name: Configure CMake for AlgoViz (Release)
        run: |
          emcmake cmake -B build/wasm-algoviz -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCORTEX_BUILD_APPS=ON

      - name: Build AlgoViz (Optimized)
        run: cmake --build build/wasm-algoviz --config Release --target algo_viz

      - name: Generate Doxygen Docs
        run: doxygen Doxyfile
      
      - name: Prepare deployment directory
        run: |
          mkdir -p deploy/examples
          mkdir -p deploy/algoviz
          mkdir -p deploy/docs

          # Copy examples and all generated runtime artifacts
          cp -R build/wasm/examples/. deploy/examples/

          # Copy the built AlgoViz app bundle (static web + compiled runtime)
          cp -R build/wasm-algoviz/apps/algo_viz/. deploy/algoviz/

          # Copy docs
          cp -R doc/html/. deploy/docs/

          # Fail fast if required AlgoViz assets are missing
          test -f deploy/algoviz/index.html
          test -f deploy/algoviz/bst.html
          test -f deploy/algoviz/union_find.html
          test -f deploy/algoviz/src/main.js
          test -f deploy/algoviz/src/js/theme.js
          test -f deploy/algoviz/src/js/union_find.js
          test -f deploy/algoviz/src/styles/main.css
          test -f deploy/algoviz/algoviz_bst.js
          test -f deploy/algoviz/algoviz_bst.wasm
          test -f deploy/algoviz/algoviz_union_find.js
          test -f deploy/algoviz/algoviz_union_find.wasm
          
          # Create a root index.html that links to everything
          cat > deploy/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0;url=examples/examples_index.html">
              <title>Cortex - Redirecting...</title>
          </head>
          <body>
              <p>Redirecting to <a href="examples/examples_index.html">Cortex Examples</a>...</p>
              <p><a href="algoviz/index.html">AlgoViz - Visualization Catalog</a></p>
          </body>
          </html>
          EOF
          
          # Copy README for reference
          cp README.md deploy/
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deploy'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
