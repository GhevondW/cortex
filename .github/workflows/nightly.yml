name: Nightly Tests

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  # Extended test suite
  extended-tests:
    name: Extended Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Run all tests (native)
        run: |
          docker compose build test-native
          docker compose up --abort-on-container-exit test-native
      
      - name: Run all tests (WASM)
        run: |
          docker compose build test-wasm
          docker compose up --abort-on-container-exit test-wasm
      
      - name: Build all examples
        run: |
          docker compose up --abort-on-container-exit build-example-native
          docker compose up --abort-on-container-exit build-example-wasm
      
      - name: Build AlgoViz
        run: docker compose up --abort-on-container-exit build-algoviz
      
      - name: Archive build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-build-artifacts
          path: |
            build/
            !build/**/_deps
          retention-days: 7

  # Memory errors and leaks. Valgrind cannot follow Boost.Context's stack
  # switches (it reports every fiber switch), so use AddressSanitizer with
  # LeakSanitizer and stack-use-after-return detection, which the per-PR
  # sanitizer job leaves off.
  memory-check:
    name: Memory Check (ASan + LSan, use-after-return)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests with sanitizers
        run: |
          docker compose run --rm \
            -e CORTEX_USE_SANITIZERS=ON \
            -e ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
            test-native

  # Code coverage
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build with coverage
        run: |
          docker compose run --rm test-native bash -c "
            cmake -B build/coverage \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCORTEX_BUILD_TESTS=ON \
              -DCMAKE_CXX_FLAGS='--coverage' &&
            cmake --build build/coverage &&
            ctest --test-dir build/coverage --output-on-failure
          "
      
      - name: Generate coverage report
        run: |
          docker compose run --rm test-native bash -c "
            apt-get update && apt-get install -y lcov &&
            lcov --capture --directory build/coverage --output-file coverage.info --ignore-errors mismatch &&
            lcov --remove coverage.info '/usr/*' '*/tests/*' '*/examples/*' '*/build/*' --output-file coverage.info --ignore-errors unused &&
            lcov --list coverage.info
          "
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.info
          fail_ci_if_error: false

  # Notify on failure
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [extended-tests, memory-check, coverage]
    if: failure()
    permissions:
      issues: write
    
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔴 Nightly Tests Failed';
            const body = `Nightly tests failed on ${new Date().toISOString()}
            
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Please investigate the failures.`;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['nightly-failure', 'bug']
            });

